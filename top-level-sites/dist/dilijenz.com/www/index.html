<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dilijenz - Coming soon</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script defer src="/static/js/matomo-loader.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #151733;
      --muted: #697087;
      --surface: #f6f8ff;
      --theme: #26324c;
      --accent: #6c7cff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.32)),
        radial-gradient(circle at 76% 18%, rgba(108, 124, 255, 0.16), transparent 34%),
        var(--surface);
      letter-spacing: 0;
    }

    main {
      width: min(100%, 460px);
      display: grid;
      place-items: center;
    }

    .lockup {
      display: grid;
      justify-items: center;
      gap: 18px;
      padding: 20px 0;
      text-align: center;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .logo {
      display: grid;
      justify-items: center;
      gap: 18px;
    }

    .logo-mark {
      width: clamp(104px, 18vw, 148px);
      aspect-ratio: 1;
    }

    .logo-mark.has-image {
      width: min(62vw, 220px);
      height: auto;
      aspect-ratio: auto;
    }

    .logo-mark svg,
    .logo-mark img {
      width: 100%;
      height: auto;
      display: block;
    }

    .wordmark {
      color: var(--theme);
      font-size: clamp(32px, 8vw, 56px);
      line-height: 0.94;
      font-weight: 840;
      letter-spacing: 0;
    }

    .message {
      margin: 6px 0 0;
      color: var(--ink);
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.1;
      font-weight: 780;
      letter-spacing: 0;
    }

    .small {
      margin: 0;
      max-width: 34ch;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main aria-labelledby="holding-message">
    <section class="lockup">
      <p class="eyebrow">Coming soon</p>
      <div class="logo" aria-label="Dilijenz">
        <div class="logo-mark has-image">
          <img src="/assets/dilijenz-logo-lockup.png" alt="Dilijenz Boards Made Simple">
        </div>
      </div>
      <p class="message" id="holding-message">Hard at work</p>
    </section>
  </main>

<section class="tonywood-funnel-strip" aria-label="TonyWood advisory">

      z-index: 2147483000;

      letter-spacing: 0;

    .tonywood-funnel-strip strong {
      display: block;
      font-size: 14px;
      line-height: 1.2;
    }

    .tonywood-funnel-strip span {

      color: #4b5563;
      font-size: 13px;
      line-height: 1.35;
    }

    .tonywood-funnel-strip a {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;

      background: #111827;
      color: #ffffff;
      font-size: 13px;

      text-decoration: none;

    @media (max-width: 680px) {

        align-items: stretch;

      }

      .tonywood-funnel-strip a {

</section>
</body>
</html>
