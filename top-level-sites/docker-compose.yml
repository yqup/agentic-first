name: top-level-sites

services:
  yqup_com:
    image: caddy:2.8.4-alpine
    container_name: site-yqup_com
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:8211:8080"
    volumes:
      - ./dist/yqup.com/www:/srv/site:ro
      - ./dist/yqup.com/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /config
      - /data
      - /tmp

