name: Publish to PyPI

# Builds and publishes agentic-first-schema to PyPI on every v* tag.
#
# Uses PyPI Trusted Publishing (OIDC) - no API tokens stored anywhere.
# Before this workflow can succeed, the project must exist on PyPI and
# this repo must be registered as a Trusted Publisher; see the
# accompanying README in .github/workflows/.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install build tools
        run: python -m pip install --upgrade pip build

      - name: build
        working-directory: python/agentic_first_schema
        run: python -m build

      - name: upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/agentic_first_schema/dist/

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentic-first-schema
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - name: download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
