name: CI

# Lints the JSON Schemas and worked examples, builds the
# agentic-first-schema Python package, and exercises the
# `agentic-first-validate` CLI against every example profile.
#
# Runs on:
#   - every push to main
#   - every pull request
#   - every tag push (so the publish workflow can rely on a green CI)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  schemas-and-examples:
    name: schemas + examples (pure JSON sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: every schema is parseable JSON
        run: |
          set -euo pipefail
          for f in directory/schemas/*/*.json; do
            python3 -c "import json,sys; json.load(open('$f'))"
            echo "  ok: $f"
          done

      - name: every example is parseable JSON
        run: |
          set -euo pipefail
          for f in directory/examples/*.json; do
            python3 -c "import json,sys; json.load(open('$f'))"
            echo "  ok: $f"
          done

  validator:
    name: agentic-first-schema (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install package
        working-directory: directory/python/agentic_first_schema
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: CLI smoke test - help
        run: agentic-first-validate --help

      - name: CLI smoke test - every example must validate
        run: |
          set -euo pipefail
          for f in directory/examples/*.json; do
            echo "==> $f"
            agentic-first-validate "$f"
          done

      - name: CLI smoke test - stdin pipe
        run: |
          cat directory/examples/company-public.json | agentic-first-validate -

  build-distribution:
    name: build sdist + wheel + twine check
    runs-on: ubuntu-latest
    needs: [schemas-and-examples, validator]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install build tools
        run: python -m pip install --upgrade pip build twine

      - name: build
        working-directory: directory/python/agentic_first_schema
        run: python -m build

      - name: twine check
        working-directory: directory/python/agentic_first_schema
        run: python -m twine check dist/*

      - name: upload dist as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: directory/python/agentic_first_schema/dist/
          retention-days: 14
